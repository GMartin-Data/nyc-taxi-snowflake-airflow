[lint.isort]
# Modules of airflow/include/ are first-party, imported as siblings by the
# scripts and as `include.*` by the DAGs; declared by name because ruff only
# detects them from the filesystem once their files exist
known-first-party = [
    "include",
    "check_connection",
    "load_month",
    "load_zones",
    "snowflake_loader",
    "tlc",
]
